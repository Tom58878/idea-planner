<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Planificateur de Contenu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="py-6 border-b border-slate-800 text-center">
    <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
      📌 Le Planificateur
    </h1>
    <p class="text-slate-400 text-sm mt-1">
      Ta niche, tes plateformes, 30 secondes plus tard : tes idées de contenu prêtes à tourner.
    </p>
  </header>

  <!-- Main Form -->
  <main class="max-w-2xl mx-auto w-full px-4 py-8 flex-grow">
    <form id="planner-form" class="space-y-6 bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 shadow-xl backdrop-blur-sm">
      
      <!-- Niche -->
      <div>
        <label for="niche" class="block text-sm font-medium text-slate-300 mb-2">Ta niche / ton sujet</label>
        <input type="text" id="niche" placeholder="ex: Finances personnelles, Épargne, Crypto..." required
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
      </div>

      <!-- Settings Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- Ton -->
        <div>
          <label for="tone" class="block text-sm font-medium text-slate-300 mb-2">Ton</label>
          <select id="tone" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
            <option value="Percutant & Énergique">Percutant & Énergique</option>
            <option value="Éducatif & Clair">Éducatif & Clair</option>
            <option value="Inspirant & Storytelling">Inspirant & Storytelling</option>
            <option value="Humoristique & Décalé">Humoristique & Décalé</option>
          </select>
        </div>

        <!-- Nombre de jours (4, 7 ou 14) -->
        <div>
          <label for="count" class="block text-sm font-medium text-slate-300 mb-2">Nombre d'idées</label>
          <select id="count" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
            <option value="4">4 jours</option>
            <option value="7" selected>7 jours (1 semaine)</option>
            <option value="14">14 jours (2 semaines)</option>
          </select>
        </div>

        <!-- Objectif -->
        <div>
          <label for="goal" class="block text-sm font-medium text-slate-300 mb-2">Objectif</label>
          <select id="goal" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
            <option value="Vente / Conversion">Vente / Conversion</option>
            <option value="Notoriété / Reach">Notoriété / Reach</option>
            <option value="Engagement / Communauté">Engagement / Communauté</option>
          </select>
        </div>

      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn"
        class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-purple-500/25 flex items-center justify-center space-x-2">
        <span>Générer mon plan</span>
      </button>

    </form>

    <!-- Loading State -->
    <div id="loading" class="hidden my-12 text-center space-y-3">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-500 border-t-transparent"></div>
      <p class="text-slate-400 text-sm animate-pulse">L'IA prépare tes idées de contenu...</p>
    </div>

    <!-- Results Section -->
    <div id="results" class="mt-8 space-y-6"></div>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-800">
    Propulsé par Mistral AI & Netlify
  </footer>

</body>
</html>
