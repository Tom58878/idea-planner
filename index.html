<script>
(function(){
  const chips = document.querySelectorAll('.chip');
  chips.forEach(c => c.addEventListener('click', () => c.classList.toggle('on')));
 
  const errMsg = document.getElementById('errMsg');
  const resultsZone = document.getElementById('resultsZone');
  const toolbar = document.getElementById('toolbar');
  const copyBtn = document.getElementById('copyBtn');
  const allPayBtns = () => document.querySelectorAll('.pay-btn');
 
  let lastIdeas = [];
 
  function selectedPlatforms(){
    return Array.from(chips).filter(c => c.classList.contains('on')).map(c => c.dataset.p);
  }
 
  function setPlatforms(list){
    if(!list || !list.length) return;
    chips.forEach(c => {
      c.classList.toggle('on', list.includes(c.dataset.p));
    });
  }
 
  function pinColor(seed){
    const colors = ['#ff8a80','#8ad1ff','#c9f27a','#ffd27a'];
    return colors[seed % colors.length];
  }
 
  function renderLoading(){
    resultsZone.innerHTML = `<div class="loading-wrap">Le tableau se remplit d'idées... 📌</div>`;
  }
 
  function renderError(msg){
    errMsg.textContent = msg;
  }
 
  function pillarClass(p){
    const key = (p||'').toLowerCase();
    if(key.includes('vente')) return 'vente';
    if(key.includes('story')) return 'storytelling';
    if(key.includes('viral')) return 'viralite';
    return 'education';
  }
 
  function renderIdeas(ideas, userTone){
    toolbar.style.display = 'flex';
    resultsZone.innerHTML = `<div class="notes-grid">${
      ideas.map((idea, i) => `
        <div class="note" style="transform: rotate(${(i % 5 - 2) * 1.1}deg);">
          <style>.note:nth-child(${i+1})::before{background:${pinColor(i)};}</style>
          <div class="note-head">
            <div>
              <div class="day-idx">JOUR ${String(i+1).padStart(2,'0')}</div>
              <span class="pillar-tag ${pillarClass(idea.objective)}">${idea.objective || 'Éducation / Expertise'}</span>
              <div class="meta-tag">🎭 Ton : ${idea.tone || userTone}</div>
            </div>
            <button class="card-copy-btn" data-idx="${i}" title="Copier ce post-it">📋</button>
          </div>
 
          <div class="block-label">🪝 Hook</div>
          <div class="hook-text">${idea.hook}</div>
 
          <div class="block-label">💡 Concept</div>
          <p class="concept-text">${idea.concept}</p>
 
          <div class="block-label">📝 Structure</div>
          <ol class="structure-list">${
            (idea.structure || []).map(s => `<li>${s}</li>`).join('')
          }</ol>
 
          <div class="block-label">⚙️ Format</div>
          <div class="format-line">${idea.format}</div>
          <div class="cta-text">📣 ${idea.cta}</div>
 
          <div class="platform-tags" style="margin-top:9px;">${
            (idea.platforms || []).map(p => `<span class="ptag ${p}">${p}</span>`).join('')
          }</div>
        </div>
      `).join('')
    }</div>`;
 
    resultsZone.querySelectorAll('.card-copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idea = lastIdeas[parseInt(btn.dataset.idx, 10)];
        navigator.clipboard.writeText(ideaToText(idea, userTone)).then(() => {
          const original = btn.textContent;
          btn.textContent = '✓';
          setTimeout(() => btn.textContent = original, 1200);
        });
      });
    });
  }
 
  async function generateIdeas(countOverride){
    const niche = document.getElementById('niche').value.trim();
    const platforms = selectedPlatforms();
    const tone = document.getElementById('tone').value;
    const objective = document.getElementById('objective').value;
    const count = countOverride || "1";
    errMsg.textContent = '';
 
    if(!niche){ renderError('Écris ta niche pour commencer.'); return; }
    if(platforms.length === 0){ renderError('Choisis au moins une plateforme.'); return; }
 
    if (typeof gtag === 'function') gtag('event', 'generate_clicked', { 'niche': niche });
 
    renderLoading();
 
    try{
      const response = await fetch("/api/generate-ideas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ niche, platforms, tone, count, objective })
      });
 
      const data = await response.json();
      if(!response.ok || data.error) throw new Error(data.error || 'request-failed');
 
      lastIdeas = data.ideas;
      renderIdeas(data.ideas, tone);
    }catch(e){
      resultsZone.innerHTML = '';
      renderError("Erreur lors de la génération : " + (e.message || "réessaie."));
    }
  }
 
  async function checkout(packType, eventName, count){
    const niche = document.getElementById('niche').value.trim();
    if(!niche){ renderError('Entre d\'abord ta niche ci-dessus.'); return; }
 
    const platforms = selectedPlatforms();
    if(platforms.length === 0){ renderError('Choisis au moins une plateforme.'); return; }
 
    const tone = document.getElementById('tone').value;
    const objective = document.getElementById('objective').value;
 
    if (typeof gtag === 'function') gtag('event', eventName);
 
    allPayBtns().forEach(b => b.disabled = true);
 
    try{
      const res = await fetch("/api/create-checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ packType, niche, count, platforms, tone, objective })
      });
      const data = await res.json();
 
      if(data.url){
        window.location.href = data.url;
      } else {
        renderError("Impossible d'ouvrir le paiement Stripe.");
        allPayBtns().forEach(b => b.disabled = false);
      }
    }catch(e){
      renderError("Erreur de connexion au serveur de paiement.");
      allPayBtns().forEach(b => b.disabled = false);
    }
  }
 
  function ideaToText(idea, defaultTone){
    return `🎯 Objectif : ${idea.objective}\n` +
      `🎭 Ton : ${idea.tone || defaultTone}\n` +
      `🪝 Hook : ${idea.hook}\n` +
      `💡 Concept : ${idea.concept}\n` +
      `📝 Structure :\n${(idea.structure||[]).map(s => `  - ${s}`).join('\n')}\n` +
      `⚙️ Format : ${idea.format}\n` +
      `📣 CTA : ${idea.cta}\n` +
      `📱 Plateformes : ${(idea.platforms||[]).join(', ')}\n`;
  }
 
  document.getElementById('btnFree').addEventListener('click', () => generateIdeas("1"));
  // On passe directement 'starter' ou 'pro' ici
  document.getElementById('btnStarter').addEventListener('click', () => checkout('starter', 'starter_clicked', '5'));
  document.getElementById('btnPremium').addEventListener('click', () => checkout('pro', 'premium_clicked', '14'));
 
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('success') === 'true') {
      const urlNiche = params.get('niche') || '';
      const urlCount = params.get('count') || '5';
      const urlPlatforms = (params.get('platforms') || '').split(',').filter(Boolean);
      const urlTone = params.get('tone') || '';
      const urlObjective = params.get('objective') || 'balanced';
 
      if (urlNiche) {
        document.getElementById('niche').value = urlNiche;
        setPlatforms(urlPlatforms);
        if (urlTone) document.getElementById('tone').value = urlTone;
        document.getElementById('objective').value = urlObjective;
 
        generateIdeas(urlCount);
 
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }
  });
 
  copyBtn.addEventListener('click', () => {
    const tone = document.getElementById('tone').value;
    const text = lastIdeas.map((idea, i) => `JOUR ${i+1}\n` + ideaToText(idea, tone)).join('\n---\n\n');
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'Copié ✓';
      setTimeout(() => copyBtn.textContent = 'Copier tout le texte', 1600);
    });
  });
})();
</script>
