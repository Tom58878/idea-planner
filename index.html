<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Planificateur d'Idées de Contenu</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f5f5f7; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; color: #111; text-align: center; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 30px; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .chip { padding: 8px 16px; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; user-select: none; background: #f9f9f9; }
    .chip.on { background: #0071e3; color: white; border-color: #0071e3; }
    
    .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 30px 0; }
    .price-card { border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; text-align: center; background: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    .price-card h3 { margin: 0 0 10px 0; }
    .price-card .price { font-size: 24px; font-weight: bold; margin: 10px 0; color: #111; }
    .price-card button { padding: 12px; border: none; border-radius: 8px; background: #0071e3; color: white; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; }
    .price-card button:hover { background: #005bb5; }
    .price-card button.secondary { background: #e5e5ea; color: #111; }
    .price-card button.secondary:hover { background: #d1d1d6; }
    
    .error-msg { color: #d93025; text-align: center; font-weight: 600; margin: 15px 0; }
    
    .toolbar { display: none; justify-content: flex-end; margin-bottom: 15px; }
    .toolbar button { padding: 8px 16px; border-radius: 6px; border: 1px solid #ccc; background: white; cursor: pointer; }
    
    .notes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
    .note { background: #fffde7; padding: 20px; border-radius: 8px; box-shadow: 2px 4px 10px rgba(0,0,0,0.1); position: relative; border-left: 5px solid #ffd54f; }
    .note-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .day-idx { font-size: 12px; font-weight: bold; color: #888; }
    .pillar-tag { font-size: 11px; padding: 3px 8px; border-radius: 12px; background: #eee; font-weight: 600; text-transform: uppercase; }
    .pillar-tag.vente { background: #ffebee; color: #c62828; }
    .pillar-tag.storytelling { background: #e8eaf6; color: #283593; }
    .pillar-tag.viralite { background: #f3e5f5; color: #6a1b9a; }
    .pillar-tag.education { background: #e8f5e9; color: #2e7d32; }
    
    .card-copy-btn { background: none; border: none; cursor: pointer; font-size: 16px; }
    .block-label { font-weight: bold; font-size: 12px; color: #555; margin-top: 10px; text-transform: uppercase; }
    .hook-text { font-size: 15px; font-weight: 600; margin: 4px 0; }
    .concept-text { font-size: 14px; margin: 4px 0; color: #444; }
    .structure-list { margin: 4px 0; padding-left: 20px; font-size: 13px; color: #555; }
    .format-line { font-size: 13px; font-style: italic; color: #666; margin-top: 6px; }
    .cta-text { font-size: 13px; font-weight: 600; color: #0071e3; margin-top: 6px; }
    .platform-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .ptag { font-size: 10px; background: #e0e0e0; padding: 2px 6px; border-radius: 4px; }
    
    .loading-wrap { text-align: center; padding: 40px; font-size: 18px; color: #666; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📌 Le Planificateur d'Idées</h1>
    <p class="subtitle">Génère des concepts de contenu à fort impact pour tes réseaux sociaux.</p>

    <div class="form-group">
      <label for="niche">Sujet / Niche :</label>
      <input type="text" id="niche" placeholder="Ex: Musculation, Crypto, Boulangerie..." />
    </div>

    <div class="form-group">
      <label>Plateformes :</label>
      <div class="chips">
        <div class="chip on" data-p="Instagram">Instagram</div>
        <div class="chip on" data-p="TikTok">TikTok</div>
        <div class="chip" data-p="LinkedIn">LinkedIn</div>
        <div class="chip" data-p="YouTube">YouTube</div>
      </div>
    </div>

    <div style="display: flex; gap: 15px;">
      <div class="form-group" style="flex: 1;">
        <label for="tone">Ton :</label>
        <select id="tone">
          <option value="Inspirant">Inspirant</option>
          <option value="Educatif">Éducatif</option>
          <option value="Humoristique">Humoristique</option>
          <option value="Direct / Sans filtre">Direct / Sans filtre</option>
        </select>
      </div>
      <div class="form-group" style="flex: 1;">
        <label for="focus">Objectif principal :</label>
        <select id="focus">
          <option value="Notoriété">Notoriété / Engagement</option>
          <option value="Vente">Vente / Conversion</option>
          <option value="Fidélisation">Fidélisation</option>
        </select>
      </div>
    </div>

    <div id="errMsg" class="error-msg"></div>

    <div class="pricing-grid">
      <div class="price-card">
        <div>
          <h3>Essai Gratuit</h3>
          <p>1 idée pour tester</p>
          <div class="price">0 €</div>
        </div>
        <button id="btnFree" class="secondary">Générer 1 idée</button>
      </div>

      <div class="price-card">
        <div>
          <h3>Pack Découverte</h3>
          <p>5 idées prêtes à publier</p>
          <div class="price">2,99 €</div>
        </div>
        <button id="btnStarter">Acheter 5 idées</button>
      </div>

      <div class="price-card">
        <div>
          <h3>Pack Pro</h3>
          <p>30 idées (1 mois complet)</p>
          <div class="price">5,99 €</div>
        </div>
        <button id="btnPremium">Acheter 30 idées</button>
      </div>
    </div>

    <div id="toolbar" class="toolbar">
      <button id="copyBtn">Copier tout le texte</button>
    </div>

    <div id="resultsZone"></div>
  </div>

<script>
(function(){
  const chips = document.querySelectorAll('.chip');
  chips.forEach(c => c.addEventListener('click', () => c.classList.toggle('on')));

  const errMsg = document.getElementById('errMsg');
  const resultsZone = document.getElementById('resultsZone');
  const toolbar = document.getElementById('toolbar');
  const copyBtn = document.getElementById('copyBtn');

  const PRICE_STARTER = 'price_1U0jQuAJrUXZ5lo7f6juLGoR';
  const PRICE_PREMIUM = 'price_1U0jRUAJrUXZ5lo7qFS1CDPv';

  let lastIdeas = [];

  function selectedPlatforms(){
    return Array.from(chips).filter(c => c.classList.contains('on')).map(c => c.dataset.p);
  }

  function pinColor(seed){
    const colors = ['#ff8a80','#8ad1ff','#c9f27a','#ffd27a'];
    return colors[seed % colors.length];
  }

  function renderLoading(){
    resultsZone.innerHTML = `<div class="loading-wrap">Le tableau se remplit d'idées... 📌</div>`;
  }

  function renderError(msg){
    errMsg.textContent = msg;
  }

  function pillarClass(p){
    const key = (p||'').toLowerCase();
    if(key.includes('vente')) return 'vente';
    if(key.includes('story')) return 'storytelling';
    if(key.includes('viral')) return 'viralite';
    return 'education';
  }

  function renderIdeas(ideas){
    toolbar.style.display = 'flex';
    resultsZone.innerHTML = `<div class="notes-grid">${
      ideas.map((idea, i) => `
        <div class="note" style="transform: rotate(${(i % 5 - 2) * 1.1}deg);">
          <style>.note:nth-child(${i+1})::before{background:${pinColor(i)};}</style>
          <div class="note-head">
            <div>
              <div class="day-idx">JOUR ${String(i+1).padStart(2,'0')}</div>
              <span class="pillar-tag ${pillarClass(idea.pillar)}">${idea.pillar || 'Éducation'}</span>
            </div>
            <button class="card-copy-btn" data-idx="${i}" title="Copier ce post-it">📋</button>
          </div>

          <div class="block-label">🪝 Hook</div>
          <div class="hook-text">${idea.hook}</div>

          <div class="block-label">💡 Concept</div>
          <p class="concept-text">${idea.concept}</p>

          <div class="block-label">📝 Structure</div>
          <ol class="structure-list">${
            (idea.structure || []).map(s => `<li>${s}</li>`).join('')
          }</ol>

          <div class="block-label">⚙️ Format</div>
          <div class="format-line">${idea.format}</div>
          <div class="cta-text">📣 ${idea.cta}</div>

          <div class="platform-tags" style="margin-top:9px;">${
            (idea.platforms || []).map(p => `<span class="ptag ${p}">${p}</span>`).join('')
          }</div>
        </div>
      `).join('')
    }</div>`;

    resultsZone.querySelectorAll('.card-copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idea = lastIdeas[parseInt(btn.dataset.idx, 10)];
        navigator.clipboard.writeText(ideaToText(idea)).then(() => {
          const original = btn.textContent;
          btn.textContent = '✓';
          setTimeout(() => btn.textContent = original, 1200);
        });
      });
    });
  }

  async function generateIdeas(niche, count){
    const platforms = selectedPlatforms();
    const tone = document.getElementById('tone').value;
    const focus = document.getElementById('focus').value;

    renderLoading();

    try {
      const response = await fetch("/.netlify/functions/generate-ideas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ niche, platforms, tone, count, focus })
      });

      const data = await response.json();
      if(!response.ok || data.error) throw new Error(data.error || 'request-failed');

      lastIdeas = data.ideas;
      renderIdeas(data.ideas);
    } catch(e) {
      resultsZone.innerHTML = '';
      renderError("Erreur lors de la génération. Réessaie !");
    }
  }

  // Vérification au retour de paiement Stripe
  const urlParams = new URLSearchParams(window.location.search);
  const isSuccess = urlParams.get('success');
  const savedNiche = urlParams.get('niche');

  if (isSuccess === 'true' && savedNiche) {
    document.getElementById('niche').value = savedNiche;
    generateIdeas(savedNiche, "5");
  }

  // Événements boutons
  document.getElementById('btnFree').addEventListener('click', () => {
    const niche = document.getElementById('niche').value.trim();
    if(!niche){ renderError('Écris ta niche pour commencer.'); return; }
    generateIdeas(niche, "1");
  });

  document.getElementById('btnStarter').addEventListener('click', () => checkout(PRICE_STARTER, 'starter_clicked'));
  document.getElementById('btnPremium').addEventListener('click', () => checkout(PRICE_PREMIUM, 'premium_clicked'));

  async function checkout(priceId, eventName){
    const niche = document.getElementById('niche').value.trim();
    if(!niche){ renderError('Entre d\'abord ta niche ci-dessus.'); return; }

    try{
      const res = await fetch("/.netlify/functions/create-checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ priceId, niche })
      });
      const data = await res.json();
      if(data.url) window.location.href = data.url;
      else renderError("Impossible d'ouvrir le paiement Stripe.");
    }catch(e){
      renderError("Erreur de connexion au serveur de paiement.");
    }
  }

  function ideaToText(idea){
    return `JOUR — ${idea.pillar}\n` +
      `Hook : ${idea.hook}\n` +
      `Concept : ${idea.concept}\n` +
      `Structure :\n${(idea.structure||[]).map(s => `  - ${s}`).join('\n')}\n` +
      `Format : ${idea.format}\n` +
      `CTA : ${idea.cta}\n` +
      `Plateformes : ${(idea.platforms||[]).join(', ')}\n`;
  }

  copyBtn.addEventListener('click', () => {
    const text = lastIdeas.map((idea, i) => `JOUR ${i+1}\n` + ideaToText(idea)).join('\n---\n\n');
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'Copié ✓';
      setTimeout(() => copyBtn.textContent = 'Copier tout le texte', 1600);
    });
  });
})();
</script>

</body>
</html>
